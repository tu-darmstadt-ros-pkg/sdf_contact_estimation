launch:
- node:
    pkg: robot_state_publisher
    exec: robot_state_publisher
    name: robot_state_publisher
    output: screen
    param:
    - name: robot_description
      value: $(command 'xacro $(find-pkg-share sdf_contact_estimation_demo)/urdf/tracked_robot.urdf.xacro')

- node:
    pkg: joint_state_publisher_gui
    exec: joint_state_publisher_gui
    name: joint_state_publisher_gui
    output: screen
    param:
    - name: zeros.flipper_front_joint
      value: -0.5
    - name: zeros.flipper_back_joint
      value: -0.5

- node:
    pkg: rviz2
    exec: rviz2
    name: rviz
    output: screen
    args: -d $(find-pkg-share sdf_contact_estimation_demo)/rviz/xacrodisplay.rviz
